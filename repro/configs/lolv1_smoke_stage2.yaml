# Pipeline smoke test for stage 2 (IWO); init_from the stage-1 smoke run.
exp_name: lolv1_smoke_stage2
seed: 0
device: cuda
split: train

data:
  train_inp: data/LOLv1/eval15/low
  train_gt: data/LOLv1/eval15/high
  valid_inp: data/LOLv1/eval15/low
  valid_gt: data/LOLv1/eval15/high
  test_inp: data/LOLv1/eval15/low
  test_gt: data/LOLv1/eval15/high
  cache_in_memory: true
  num_workers: 0

model:
  channels: 12
  rep_scale: 4
  type: iwo
  iwo_learn_init: zero

loss:
  pixel: lvw_official

optim:
  stage: 2
  init_from: runs/smoke_s1/ckpt/model_best.pkl
  batch_size: 2
  epochs: 2
  lr: 1e-4
  lr_warmup: 1e-6
  weight_decay: 0
  scheduler: {t0: 50, t_mult: 2, eta_min: 1e-7}
  save_every: 2
  save_slim: true

eval:
  use_lpips: true
  lpips_net: alex
  clip: true
