# MobileIE on LOLv1 - stage 2: Incremental Weight Optimisation (paper Eq. 1-2, Fig. 10)
# W_pre = stage-1 optimum, frozen; W_learn = additive trainable weight on conv_out.
exp_name: lolv1_stage2_iwo
seed: 0
device: cuda
split: train

data:
  train_inp: data/LOLv1/our485/low
  train_gt: data/LOLv1/our485/high
  valid_inp: data/LOLv1/eval15/low
  valid_gt: data/LOLv1/eval15/high
  test_inp: data/LOLv1/eval15/low
  test_gt: data/LOLv1/eval15/high
  cache_in_memory: true
  num_workers: 0

model:
  channels: 12
  rep_scale: 4
  type: iwo
  iwo_learn_init: zero

loss:
  pixel: lvw_official

optim:
  stage: 2
  init_from: runs/lolv1_stage1/ckpt/model_best.pkl
  batch_size: 2         # release ships 4; 2 keeps peak VRAM at 6.0GB of this 12GB card
  amp: none             # paper trains fp32; bf16 is available when the card is contended
  cudnn_benchmark: true # false -> bit-reproducible reruns, slightly slower
  epochs: 1000
  lr: 1e-3
  lr_warmup: 1e-6
  weight_decay: 0
  scheduler: {t0: 50, t_mult: 2, eta_min: 1e-7}
  save_every: 100
  save_slim: true

eval:
  use_lpips: true
  lpips_net: alex
  clip: true
