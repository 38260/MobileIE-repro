# UIE task, author checkpoint (pretrain/uieb_best_slim.pkl) on the UIEB test split.
# The release runs UIE through the SAME lle pipeline - README item 5 says to just point
# the dataset paths at the underwater data - so model.type stays "slim"/task "lle".
exp_name: uieb_pretrained
seed: 0
device: cuda
split: test

data:
  kind: rgb
  test_inp: data/UIEB/test/input
  test_gt: data/UIEB/test/gt
  # resize_wh: [640, 480]     # second convention, matching Table 2's 640x480 column
  cache_in_memory: true
  num_workers: 0

model:
  channels: 12
  rep_scale: 4
  type: slim
  task: lle
  pretrained: ../MobileIE-main/MobileIE-main/pretrain/uieb_best_slim.pkl

optim:
  batch_size: 1

eval:
  use_lpips: true
  lpips_net: alex
  clip: true
  shape: [1, 3, 460, 620]

# paper Table 2, "Ours" row
reference:
  params_k: 4.047
  psnr: 22.81
  ssim: 0.906
  lpips: 0.155
  gpu_latency_ms: 0.910
  soc_latency_ms: 8.94
  fps_640x480: 1099.370
