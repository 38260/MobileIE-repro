# Cloud run (24 GB card) - stage 1, faithful config.
# Difference from lolv1_stage1.yaml: batch_size 4 = the value the release ships,
# which the 12 GB laptop could not afford.  Everything else is identical.
exp_name: lolv1_cloud_s1
seed: 0
device: cuda
split: train

data:
  train_inp: data/LOLv1/our485/low
  train_gt: data/LOLv1/our485/high
  valid_inp: data/LOLv1/eval15/low
  valid_gt: data/LOLv1/eval15/high
  test_inp: data/LOLv1/eval15/low
  test_gt: data/LOLv1/eval15/high
  cache_in_memory: true   # ~700 MB RAM for the uint8 cache
  num_workers: 0

model:
  channels: 12
  rep_scale: 4
  type: plain
  iwo_learn_init: zero

loss:
  pixel: lvw_official

optim:
  stage: 1
  batch_size: 4           # config/lle.yaml in the release; needs ~11 GB VRAM
  epochs: 1000
  warmup_epochs: 10
  lr: 1e-3
  lr_warmup: 1e-6
  weight_decay: 0
  scheduler: {t0: 50, t_mult: 2, eta_min: 1e-7}
  amp: none
  cudnn_benchmark: true   # false for bit-reproducible reruns, slightly slower
  save_every: 100
  save_slim: true

eval:
  use_lpips: true
  lpips_net: alex
  clip: true
